name: Build and deploy to S3 and CloudFront

on:
  push:
    branches: [main]

# Required so the job can request an OIDC token from GitHub
permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          if [ -z "$VITE_API_URL" ]; then
            echo "Add the VITE_API_URL repository variable (Settings > Secrets and variables > Actions > Variables)."
            exit 1
          fi
          npm run build

      - name: Assume AWS role through OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::428571188297:role/github-actions-listings-web-deploy
          aws-region: eu-west-2

      - name: Upload build to S3
        run: aws s3 sync dist s3://biodun-listings-web-2026 --delete

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id E2UZ4ZB77JYBF5 --paths "/*"
